<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מאורת העכברים — מדד התחרותיות והפרשי הניצחון בכדורסל</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Heebo', sans-serif;
      background-color: #160e09;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(245, 158, 11, 0.10) 0%, transparent 32%),
        radial-gradient(circle at 85% 75%, rgba(180, 83, 9, 0.12) 0%, transparent 36%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 2px, transparent 2px, transparent 12px);
      color: #1c1917;
    }
    h1, h2, h3, h4, .brand-font {
      font-family: 'Rubik', 'Heebo', sans-serif;
    }
    .burrow-outer {
      background: linear-gradient(180deg, #2a1b12 0%, #1d120c 100%);
      border-left: 8px solid #3d271a;
      border-right: 8px solid #3d271a;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.75);
    }
    .den-card {
      background: #fdfaf3;
      background-image: radial-gradient(#e7decb 0.9px, transparent 0.9px);
      background-size: 16px 16px;
      border: 3px solid #573a26;
      box-shadow: 0 6px 0 #120b07, 0 12px 24px rgba(0, 0, 0, 0.45);
      border-radius: 1.5rem;
    }
    .tab-btn {
      border: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background-color: #f59e0b;
      color: #1c1917;
      border-color: #1c1917;
      box-shadow: 0 3px 0 #1c1917;
    }
    .league-chip {
      transition: all 0.15s ease;
    }
    .league-chip.selected {
      background-color: #1c1917;
      color: #fde68a;
      border-color: #1c1917;
      box-shadow: 0 2px 0 #f59e0b;
    }
    .sortable-th {
      cursor: pointer;
      user-select: none;
    }
    .sortable-th:hover {
      background-color: #fde68a;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-[#120b07] text-amber-50 border-b-4 border-amber-500 sticky top-0 z-30 shadow-2xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="relative flex items-center justify-center w-12 h-12 rounded-2xl bg-amber-400 text-stone-950 border-2 border-amber-100 shadow-[0_3px_0_#78350f] text-2xl select-none">
          🐭
          <span class="absolute -bottom-1.5 -left-1.5 text-base">🧀</span>
        </div>
        <div>
          <div class="flex items-center gap-2.5">
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-amber-400">מאורת העכברים</h1>
            <span class="hidden sm:inline-block bg-[#291a11] text-amber-200 text-[11px] font-bold px-3 py-0.5 rounded-full border border-amber-500/40">
              🕳️ עמוק מתחת לפרקט
            </span>
          </div>
          <p class="text-amber-100/80 text-xs sm:text-sm mt-0.5">
            ניתוח הפרשי ניצחון (Margin of Victory) ב-<span id="headerLeagueCount" class="font-bold text-amber-300">12</span> ליגות לאורך 11 עונות (16/17 – *26/27)
          </p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2.5">
        <label class="inline-flex items-center gap-2 bg-[#291a11] hover:bg-[#382418] px-3.5 py-2 rounded-xl text-xs sm:text-sm cursor-pointer border border-amber-700/60 text-amber-50 font-medium">
          <input type="checkbox" id="excludePartialSeason" class="rounded text-amber-500 focus:ring-amber-500" />
          <span>עונות מלאות בלבד (16/17–25/26)</span>
        </label>
        <button onclick="exportAllCSV()" class="bg-amber-400 hover:bg-amber-300 text-stone-950 text-xs sm:text-sm font-extrabold px-4 py-2 rounded-xl border-2 border-stone-950 shadow-[0_2px_0_#fef3c7] transition">
          🧀 ייצוא CSV
        </button>
      </div>
    </div>
  </header>

  <div class="burrow-outer flex-1">
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-7 space-y-6">

      <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="kpiGrid"></section>

      <nav class="den-card p-2 flex flex-wrap gap-2">
        <button class="tab-btn active flex-1 min-w-[140px] py-2.5 px-4 rounded-xl text-sm font-extrabold" data-tab="overview">
          🏆 טבלת הצפיפות
        </button>
        <button class="tab-btn flex-1 min-w-[140px] py-2.5 px-4 rounded-xl text-sm font-extrabold text-stone-700 hover:bg-amber-100/70" data-tab="trends">
          📈 השוואת מגמות רב-ליגתית
        </button>
        <button class="tab-btn flex-1 min-w-[140px] py-2.5 px-4 rounded-xl text-sm font-extrabold text-stone-700 hover:bg-amber-100/70" data-tab="league">
          🔍 ניתוח עומק לפי ליגה
        </button>
        <button class="tab-btn flex-1 min-w-[140px] py-2.5 px-4 rounded-xl text-sm font-extrabold text-stone-700 hover:bg-amber-100/70" data-tab="notes">
          🧀 מחברת המאורה (תובנות)
        </button>
      </nav>

      <!-- TAB 1 -->
      <section id="tab-overview" class="tab-panel space-y-6">
        <div class="den-card p-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
            <div>
              <h2 class="text-lg font-black text-stone-900">מדד התחרותיות: ההפרש הממוצע בכל ליגה</h2>
              <p class="text-xs text-stone-600">תצוגה משמאל לימין • ככל שהעמודה קצרה יותר, הליגה צמודה ומותחת יותר</p>
            </div>
          </div>
          <div class="h-96" dir="ltr">
            <canvas id="rankingBar
