<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מאורת העכברים — מעבדת התחרותיות והפרשי הניצחון בכדורסל</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* רקע מחילת עכברים תת-קרקעית חמה */
    body {
      font-family: 'Heebo', sans-serif;
      background-color: #231710;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(245, 158, 11, 0.08) 0%, transparent 28%),
        radial-gradient(circle at 88% 72%, rgba(217, 119, 6, 0.07) 0%, transparent 32%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 10px);
      color: #1c1917;
    }
    h1, h2, h3, .brand-font {
      font-family: 'Rubik', 'Heebo', sans-serif;
    }
    /* מסגרת של קשת מחילה חצובה באדמה */
    .burrow-shell {
      background: linear-gradient(180deg, #332218 0%, #261911 100%);
      border-left: 6px solid #452e20;
      border-right: 6px solid #452e20;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.65);
    }
    /* כרטיסיית קלף/עץ בתוך המאורה */
    .den-card {
      background: #fdfaf3;
      background-image: radial-gradient(#e6dcc8 0.9px, transparent 0.9px);
      background-size: 16px 16px;
      border: 3px solid #5c3d28;
      box-shadow: 0 6px 0 #140d09, 0 10px 20px rgba(0,0,0,0.45);
      border-radius: 1.5rem;
    }
    .tab-btn {
      border: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background-color: #f59e0b;
      color: #1c1917;
      border-color: #231710;
      box-shadow: 0 3px 0 #231710;
    }
    .league-chip {
      transition: all 0.15s ease;
    }
    .league-chip.selected {
      background-color: #231710;
      color: #fde68a;
      border-color: #231710;
      box-shadow: 0 2px 0 #f59e0b;
    }
    .sortable-th {
      cursor: pointer;
      user-select: none;
    }
    .sortable-th:hover {
      background-color: #fde68a;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(7deg); }
    }
    .mouse-wiggle:hover {
      animation: wiggle 0.35s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header (קורת הכניסה למאורה) -->
  <header class="bg-[#180f0a] text-amber-50 border-b-4 border-amber-500 sticky top-0 z-30 shadow-2xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="mouse-wiggle relative flex items-center justify-center w-13 h-13 p-2.5 rounded-2xl bg-amber-400 text-stone-950 border-2 border-amber-100 shadow-[0_3px_0_#78350f] text-2xl select-none">
          🐭
          <span class="absolute -bottom-1.5 -left-1.5 text-base">🧀</span>
        </div>
        <div>
          <div class="flex items-center gap-2.5">
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-amber-400">מאורת העכברים</h1>
            <span class="hidden sm:inline-block bg-[#2d1e15] text-amber-200 text-[11px] font-bold px-3 py-0.5 rounded-full border border-amber-500/50">
              🕳️ עמוק מתחת לפרקט
            </span>
          </div>
          <p class="text-amber-100/80 text-xs sm:text-sm mt-0.5">
            מכרסמים בנתונים: הפרשי ניצחון (Margin of Victory) ב-<span id="headerLeagueCount" class="font-bold text-amber-300">13</span> ליגות לאורך 11 עונות (16/17 – *2
